display_information:
  name: Specification Agent
  description: Software Factory - turns a frozen TOR into an approved SRS
features:
  bot_user:
    display_name: specification
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - files:read
      - files:write
      - users:read
settings:
  event_subscriptions:
    request_url: https://wewebplus-software-factory.vercel.app/eve/specification/v1/slack
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://wewebplus-software-factory.vercel.app/eve/specification/v1/slack
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
